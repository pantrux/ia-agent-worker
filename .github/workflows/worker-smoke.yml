# Smoke HTTP contra el Worker desplegado (URL en variable WORKER_SMOKE_URL).
# Sin esa variable el job falla de forma explícita (evita CI verde falso).

name: Worker smoke (remote)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: worker-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Check principal: debe poder usarse en branch protection sin depender de LangSmith.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      langsmith_ready: ${{ steps.langsmith_secret_check.outputs.present }}
    steps:
      - uses: actions/checkout@v4

      - name: Detectar LANGSMITH_API_KEY (solo salida booleana; no exponer el secreto)
        id: langsmith_secret_check
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: |
          if [ -n "${LANGSMITH_API_KEY}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Remote smoke (/ping, chat opcional)
        env:
          WORKER_SMOKE_URL: ${{ vars.WORKER_SMOKE_URL }}
          SMOKE_INCLUDE_CHAT: ${{ vars.SMOKE_INCLUDE_CHAT }}
          WORKER_SMOKE_BFF_TOKEN: ${{ secrets.WORKER_SMOKE_BFF_TOKEN }}
        run: |
          if [ -z "${WORKER_SMOKE_URL}" ]; then
            echo "::error::Falta la variable de repositorio WORKER_SMOKE_URL (Settings → Secrets and variables → Actions → Variables). Ejemplo: https://ia-agent-worker.<account>.workers.dev"
            exit 1
          fi
          npm run smoke:worker

  # Job separado: fallos de API LangSmith (403, etc.) no bloquean el smoke del Worker.
  # En branch protection, exige solo el job `smoke` si LangSmith aún se está configurando.
  langsmith:
    needs: smoke
    if: needs.smoke.outputs.langsmith_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: LangSmith — preflight API (diagnóstico)
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_WORKSPACE_ID: ${{ vars.LANGSMITH_WORKSPACE_ID }}
          LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT }}
        run: npm run langsmith:api-preflight

      - name: LangSmith — sincronizar dataset y eval
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_WORKSPACE_ID: ${{ vars.LANGSMITH_WORKSPACE_ID }}
          LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT }}
          LANGSMITH_TRACING: "true"
          LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT }}
          LANGSMITH_EVAL_DATASET_NAME: ${{ vars.LANGSMITH_EVAL_DATASET_NAME }}
          EVAL_MIN_MEAN_SCORE: ${{ vars.EVAL_MIN_MEAN_SCORE }}
          LANGSMITH_EXPERIMENT_PREFIX: ${{ github.sha }}
          WORKER_SMOKE_URL: ${{ vars.WORKER_SMOKE_URL }}
          WORKER_SMOKE_BFF_TOKEN: ${{ secrets.WORKER_SMOKE_BFF_TOKEN }}
        run: |
          npm run langsmith:dataset:sync
          npm run langsmith:eval
