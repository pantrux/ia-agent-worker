# Crea (si no existen) el AI Gateway y los custom providers GitHub Models + Copilot Enterprise (idempotente).
# Requiere secret: CLOUDFLARE_API_TOKEN (se pasa como CF_AI_GATEWAY_API_TOKEN al script; Account → AI Gateway → Edit).

name: Provision AI Gateway

on:
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Provision gateway + custom provider
        env:
          CF_AI_GATEWAY_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AI_GATEWAY_ID: ${{ vars.AI_GATEWAY_ID }}
          AI_GATEWAY_PROVIDER_SLUG: ${{ vars.AI_GATEWAY_PROVIDER_SLUG }}
          AI_GATEWAY_CUSTOM_BASE_URL: ${{ vars.AI_GATEWAY_CUSTOM_BASE_URL }}
          AI_GATEWAY_COPILOT_SLUG: ${{ vars.AI_GATEWAY_COPILOT_SLUG }}
          AI_GATEWAY_COPILOT_BASE_URL: ${{ vars.AI_GATEWAY_COPILOT_BASE_URL }}
        run: |
          if [ -z "${CF_AI_GATEWAY_API_TOKEN}" ]; then
            echo "::error::Falta el secret CLOUDFLARE_API_TOKEN (se inyecta como CF_AI_GATEWAY_API_TOKEN). Crea un API Token con permiso «Account — AI Gateway — Edit»."
            exit 1
          fi
          npm run provision:ai-gateway
