name = "ia-agent-worker"
main = "src/index.ts"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "ia-agent-db"
database_id = "878d2c1e-3a72-438a-a32e-f2e12c263193"

[vars]
ALLOWED_ORIGINS = "*,http://localhost:3000,http://127.0.0.1:3000"
COPILOT_MODEL = "openai/gpt-4o-mini"
OPENAI_API_BASE = "https://models.github.ai/inference"
LANGSMITH_TRACING = "true"
LANGSMITH_PROJECT = "ia-agent-worker-demo"
LANGCHAIN_CALLBACKS_BACKGROUND = "false"
# Secreto opcional del BFF (A2): si existe, POST /api/chat y /api/chat/resume exigen `Authorization: Bearer …`
#   npx wrangler secret put BFF_API_TOKEN
#   npx wrangler secret put BFF_API_TOKEN --env preview
# Metadata LangSmith (`deployment` en runs); producción por defecto
DEPLOYMENT_ENV = "production"

# B1 AI Gateway (opcional): añade a [vars] AI_GATEWAY_ACCOUNT_ID y AI_GATEWAY_ID; opcional AI_GATEWAY_PROVIDER_SLUG.
#   Secreto recomendado: npx wrangler secret put AI_GATEWAY_API_TOKEN (cabecera cf-aig-authorization).
#   Proveedor custom hacia GitHub Models: https://developers.cloudflare.com/ai-gateway/configuration/custom-providers/

# Worker separado para staging/preview (mismo D1 que prod por defecto — valorar D1 dedicado).
[env.preview]
name = "ia-agent-worker-preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "ia-agent-db"
database_id = "878d2c1e-3a72-438a-a32e-f2e12c263193"

[env.preview.vars]
ALLOWED_ORIGINS = "*,http://localhost:3000,http://127.0.0.1:3000"
COPILOT_MODEL = "openai/gpt-4o-mini"
OPENAI_API_BASE = "https://models.github.ai/inference"
LANGSMITH_TRACING = "true"
LANGSMITH_PROJECT = "ia-agent-worker-preview"
LANGCHAIN_CALLBACKS_BACKGROUND = "false"
# Mismo secreto opcional BFF en preview: `wrangler secret put BFF_API_TOKEN --env preview`
# AI Gateway en preview: mismas vars opcionales que prod; `wrangler secret put AI_GATEWAY_API_TOKEN --env preview` si aplica.
DEPLOYMENT_ENV = "preview"
