name = "ia-agent-worker"
main = "src/index.ts"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]
account_id = "8a31ec012e21b8f414288de35697c564"
# Export a Logpush (`workers_trace_events`): requiere job en la cuenta y plan Workers de pago. Ver docs/B2b-worker-access-metrics-export.md
logpush = true

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "ia-agent-db"
database_id = "878d2c1e-3a72-438a-a32e-f2e12c263193"

# PAN-18: hilo LangGraph por chat de Telegram (`telegram:chat:{chat_id}` → thread_id).
[[kv_namespaces]]
binding = "CHAT_THREAD_KV"
id = "fc1a0df42f6a493886bf6b8d25788134"
preview_id = "1439742f07494ce5947dc0cec13cbff3"

# PAN-17: colas de ingesta + DLQ (crear con `npm run ensure:chat-queues`).
[[queues.producers]]
binding = "CHAT_INGEST_QUEUE"
queue = "ia-agent-chat-queue"

# Un mensaje por batch: cada uno ejecuta grafo + LLM (lotes grandes arriesgan timeout de CPU del Worker).
[[queues.consumers]]
queue = "ia-agent-chat-queue"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "ia-agent-chat-queue-dlq"

[vars]
ALLOWED_ORIGINS = "*,http://localhost:3000,http://127.0.0.1:3000"
# Copilot Enterprise: intercambio vía `copilot_internal/v2/token` y llamadas al host devuelto (p. ej. api.enterprise.githubcopilot.com).
# Modelo Copilot Enterprise por defecto; no se define fallback para evitar cambiar el id enviado al gateway.
# Cloudflare AI Gateway: `npm run provision:ai-gateway` crea gateway + proveedores. Copilot usa custom provider con path vacío.
COPILOT_MODEL = "gpt-5.4-mini"
OPENAI_API_BASE = "https://api.enterprise.githubcopilot.com"
LANGSMITH_TRACING = "true"
LANGSMITH_PROJECT = "ia-agent-worker-demo"
LANGCHAIN_CALLBACKS_BACKGROUND = "false"
# Secreto opcional del BFF (A2): si existe, POST /api/chat y /api/chat/resume exigen `Authorization: Bearer …`
#   npx wrangler secret put BFF_API_TOKEN
#   npx wrangler secret put BFF_API_TOKEN --env preview
# PAN-18 Telegram (entrega desde consumer de cola):
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_BOT_TOKEN --env preview
# Metadata LangSmith (`deployment` en runs); producción por defecto
DEPLOYMENT_ENV = "production"
# B1 AI Gateway (Copilot Enterprise). Orden: provision → check:ai-gateway → deploy. Copilot usa path vacío por defecto (para apuntar a /chat/completions directo).
AI_GATEWAY_ACCOUNT_ID = "8a31ec012e21b8f414288de35697c564"
AI_GATEWAY_ID = "ia-agent-worker-llm"
AI_GATEWAY_PROVIDER_SLUG = "github-copilot-enterprise"
# Para Copilot dejar vacío o no definir (así llega como /chat/completions). Para GitHub Models usar "inference".
AI_GATEWAY_PROVIDER_PATH = ""
# EXPOSE_CHAT_ERROR: solo depuración local (.dev.vars) — no activar en [vars] de producción (filtra detail/stack en 500).

# Worker separado para staging/preview (mismo D1 que prod por defecto — valorar D1 dedicado).
[env.preview]
name = "ia-agent-worker-preview"
logpush = true

[[env.preview.d1_databases]]
binding = "DB"
database_name = "ia-agent-db"
database_id = "878d2c1e-3a72-438a-a32e-f2e12c263193"

# Namespace dedicado preview (`CHAT_THREAD_KV_preview`) — no comparte hilos Telegram con prod.
[[env.preview.kv_namespaces]]
binding = "CHAT_THREAD_KV"
id = "1439742f07494ce5947dc0cec13cbff3"

[env.preview.vars]
ALLOWED_ORIGINS = "*,http://localhost:3000,http://127.0.0.1:3000"
COPILOT_MODEL = "gpt-5.4-mini"
OPENAI_API_BASE = "https://api.enterprise.githubcopilot.com"
LANGSMITH_TRACING = "true"
LANGSMITH_PROJECT = "ia-agent-worker-preview"
LANGCHAIN_CALLBACKS_BACKGROUND = "false"
# Mismo secreto opcional BFF en preview: `wrangler secret put BFF_API_TOKEN --env preview`
DEPLOYMENT_ENV = "preview"
# Mismo orden que producción: provision → check:ai-gateway → deploy (ver comentario en [vars]).
AI_GATEWAY_ACCOUNT_ID = "8a31ec012e21b8f414288de35697c564"
AI_GATEWAY_ID = "ia-agent-worker-llm"
AI_GATEWAY_PROVIDER_SLUG = "github-copilot-enterprise"
# Opcional; ignorado o vacío para Copilot. Para GitHub Models usar "inference".
AI_GATEWAY_PROVIDER_PATH = ""

# Cola dedicada preview (`wrangler queues create ia-agent-chat-queue-preview`).
[[env.preview.queues.producers]]
binding = "CHAT_INGEST_QUEUE"
queue = "ia-agent-chat-queue-preview"

[[env.preview.queues.consumers]]
queue = "ia-agent-chat-queue-preview"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "ia-agent-chat-queue-preview-dlq"
